apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: notes
spec:
  ingressClassName: nginx
  rules:
    - host: notes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080