apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: notes
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432 && nc -z redis 6379; do echo waiting; sleep 2; done
      containers:
        - name: api
          image: fastify-typescript-boilerplate-1_app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          env:
            - name: APP_PORT
              value: "8080"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_PASSWORD         # тот же пароль, что у postgres
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: 24h
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DATABASE_USER
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DATABASE_NAME
            - name: DATABASE_PORT
              value: "5432"
            - name: REDIS_CONNECTION_STRING      # ниже REDIS_PASSWORD, иначе подстановка не сработает
              value: redis://redis:6379/0
          envFrom:
            - configMapRef:
                name: api-config

          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 384Mi }